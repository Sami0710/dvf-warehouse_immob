name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifie docker-compose.yml
        run: docker compose config --quiet

      - name: Construit l'image
        run: docker compose build dbt

      - name: Valide le projet dbt (compilation des modèles)
        run: docker compose run --rm dbt parse
